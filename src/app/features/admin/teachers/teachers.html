<div class="page-header">
  <div class="breadcrumbs">
    <span class="crumb">Home</span>
    <span class="sep">/</span>
    <span class="crumb current">Teachers</span>
  </div>
</div>

<app-table
  [columns]="columns"
  [data]="rows"
  [rowActions]="actions"
  [showIndex]="true"
  [page]="page"
  [pageSize]="pageSize"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (action)="onAction($event)"
></app-table>
