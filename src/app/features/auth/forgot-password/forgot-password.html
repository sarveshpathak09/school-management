<div class="auth-container">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="header">
      <h2>Forgot password</h2>
      <p class="subtitle">We’ll email you a reset link</p>
    </div>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" placeholder="name@example.com" />
    </label>

    <button class="primary" type="submit" [disabled]="form.invalid">Send reset link</button>
    <p class="success" *ngIf="submitted">If this email exists, we’ve sent a link.</p>
  </form>
</div>
