<div class="sidebar-container">
    <div class="school-name">
      <i class="fas fa-school"></i>
      <span>My School</span>
    </div>
  
    <ul class="menu">
      @for (item of menuItems; track item.label) {
        <li [routerLink]="item.link">
          <i class="{{ item.icon }}"></i> {{ item.label }}
        </li>
      }
    </ul>
  </div>
